[project]
name = "twquant"
version = "0.1.0"
description = "TW Quant Trading System — data pipeline & strategy for TAIFEX index futures"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
